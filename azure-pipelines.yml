# Travel360 Azure DevOps Pipeline

trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    python --version
    python -m pip install --upgrade pip
    pip install dbt-snowflake
    dbt --version
  displayName: 'Install and Verify dbt'

- script: |
    cd travel360_dbt
    echo "Inside Travel360 dbt project"
    ls -la
    dbt debug --config-dir
  displayName: 'Check Travel360 dbt Project'