trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

- script: |
    python --version
    python -m pip install --upgrade pip
    pip install dbt-snowflake
    dbt --version
  displayName: 'Install dbt'

- script: |
    echo "Database: $(database_name)"
    echo "Environment: $(environment)"
  displayName: 'Show Library Variables'