name: Travel360 dbt CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: |
          pip install dbt-core==1.12.3
          pip install dbt-snowflake==1.12.0

      - name: Check dbt version
        run: dbt --version